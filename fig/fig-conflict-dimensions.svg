<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="230" viewBox="0 0 960 230" role="img" aria-label="The Three Conflict Dimensions in CLASHarness">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748b"/>
    </marker>
    <filter id="card-shadow" x="-3%" y="-4%" width="106%" height="112%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Card 1: Temporal Staleness -->
  <g transform="translate(10, 10)">
    <rect width="300" height="210" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#card-shadow)"/>
    <rect width="300" height="36" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
    <rect y="28" width="300" height="8" fill="#f8fafc"/>
    <text x="16" y="23" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#1e293b">◈ 1. Temporal Staleness</text>
    
    <!-- Step 1: Assertion -->
    <rect x="16" y="48" width="268" height="34" rx="5" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="24" y="64" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#64748b">SUBAGENT CLAIM</text>
    <text x="24" y="76" font-family="system-ui, sans-serif" font-size="11.5" fill="#334155">&quot;Task completed at T=0&quot;</text>

    <!-- Arrow down -->
    <line x1="150" y1="84" x2="150" y2="102" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

    <!-- Step 2: Conflict Reality -->
    <rect x="16" y="104" width="268" height="34" rx="5" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
    <text x="24" y="120" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#dc2626">SYSTEM REALITY</text>
    <text x="24" y="132" font-family="system-ui, sans-serif" font-size="11.5" fill="#991b1b">Telemetry / logs show regression</text>

    <!-- Arrow down -->
    <line x1="150" y1="140" x2="150" y2="158" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

    <!-- Step 3: Resolution -->
    <rect x="16" y="160" width="268" height="38" rx="5" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
    <text x="24" y="176" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#16a34a">COORDINATOR REQUIREMENT</text>
    <text x="24" y="190" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#15803d">Inspect authoritative on-disk state</text>
  </g>

  <!-- Card 2: Cross-Modal Discrepancy -->
  <g transform="translate(330, 10)">
    <rect width="300" height="210" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#card-shadow)"/>
    <rect width="300" height="36" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
    <rect y="28" width="300" height="8" fill="#f8fafc"/>
    <text x="16" y="23" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#1e293b">◈ 2. Cross-Modal Discrepancy</text>
    
    <!-- Step 1: Assertion -->
    <rect x="16" y="48" width="268" height="34" rx="5" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="24" y="64" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#64748b">VERBAL CLAIM</text>
    <text x="24" y="76" font-family="system-ui, sans-serif" font-size="11.5" fill="#334155">&quot;All approver signoffs OK&quot;</text>

    <!-- Arrow down -->
    <line x1="150" y1="84" x2="150" y2="102" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

    <!-- Step 2: Conflict Reality -->
    <rect x="16" y="104" width="268" height="34" rx="5" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
    <text x="24" y="120" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#dc2626">VISUAL EVIDENCE</text>
    <text x="24" y="132" font-family="system-ui, sans-serif" font-size="11.5" fill="#991b1b">UI console displays UNRECONCILED</text>

    <!-- Arrow down -->
    <line x1="150" y1="140" x2="150" y2="158" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

    <!-- Step 3: Resolution -->
    <rect x="16" y="160" width="268" height="38" rx="5" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
    <text x="24" y="176" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#16a34a">COORDINATOR REQUIREMENT</text>
    <text x="24" y="190" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#15803d">Cross-examine UI pixels vs. text</text>
  </g>

  <!-- Card 3: Actionable Delay -->
  <g transform="translate(650, 10)">
    <rect width="300" height="210" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#card-shadow)"/>
    <rect width="300" height="36" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
    <rect y="28" width="300" height="8" fill="#f8fafc"/>
    <text x="16" y="23" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#1e293b">◈ 3. Actionable Delay</text>
    
    <!-- Step 1: Assertion -->
    <rect x="16" y="48" width="268" height="34" rx="5" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="24" y="64" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#64748b">SUBMITTED ACTION</text>
    <text x="24" y="76" font-family="system-ui, sans-serif" font-size="11.5" fill="#334155">Async batch job / lease triggered</text>

    <!-- Arrow down -->
    <line x1="150" y1="84" x2="150" y2="102" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

    <!-- Step 2: Conflict Reality -->
    <rect x="16" y="104" width="268" height="34" rx="5" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
    <text x="24" y="120" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#dc2626">SYSTEM REALITY</text>
    <text x="24" y="132" font-family="system-ui, sans-serif" font-size="11.5" fill="#991b1b">Background queue / latency elapsing</text>

    <!-- Arrow down -->
    <line x1="150" y1="140" x2="150" y2="158" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

    <!-- Step 3: Resolution -->
    <rect x="16" y="160" width="268" height="38" rx="5" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
    <text x="24" y="176" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#16a34a">COORDINATOR REQUIREMENT</text>
    <text x="24" y="190" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#15803d">Poll &amp; verify physical state mutations</text>
  </g>
</svg>
